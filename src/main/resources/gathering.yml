# ==========================================================================
#  采集经验 + 资源点采掘等级（gathering.yml）
# ==========================================================================
#  重要：经验与采掘等级门槛都【挂在资源点（采集点）上编辑】，不按原版矿物配置。
#  原版矿物的经验已按需求禁用——普通挖矿 / 砍树 / 收作物不会发任何采集经验。
#
#  一、经验（由资源点编辑）
#     Collection 文件夹里每个资源点的 yml 有自己的 experience 字段：
#
#         collections:
#           铁矿石点:
#             type: MINING
#             experience: 12            # 采集成功一次发 12 点挖矿经验（抛事件给别的插件）
#             required-level: 5         # 需要【采掘等级 5】的工具才能采这个资源点
#
#     采集完成时插件按这个资源点的配置发 GatheringExperienceEvent（EarthRPGItem.api 包），
#     本插件不存经验、不算升级。
#
#  二、采掘等级门槛（由资源点编辑，只看手持工具的采掘等级）
#     上面的 required-level 直接和【主手工具】attributes 里的
#     MiningLevel / ForestLevel / FarmingLevel 比较：
#     工具采掘等级 ≥ required-level 才能开始采集，否则拦截并提示。
#     和其他插件的玩家等级无关（隔壁插件的等级不参与门槛判定）。
#     没有配置 required-level（或为 0）= 这个资源点没有门槛，谁都能采。

# 总开关。关闭后：经验不发、门槛不判。
enabled: true

# 门槛拒绝提示的节流（毫秒），避免连挖刷屏。
deny-message-cooldown-ms: 1500

messages:
  # {category} = 分类中文名（挖矿/砍树/农业），{level} = 需要采掘等级，{effective} = 你手里工具的采掘等级
  level-too-low: "&c采集失败：需要 &f{category}采掘等级 ≥ {level}&c，你手里的工具是 &f{effective}&c。"

# --------------------------------------------------------------------------
#  可选：原版方块采掘等级门槛（默认空；原版经验已禁用，这里只可能有门槛、没有经验）
# --------------------------------------------------------------------------
#  想给某些原版方块设「采掘等级才能挖」的门槛就取消注释并按需添加。注意：
#  · 原版方块【永远不会发经验】——经验只来自资源点；
#  · 判定同样只看主手工具的采掘等级（MiningLevel / ForestLevel / FarmingLevel）；
#  · 分类：MINING(挖矿) / FOREST 或 WOODCUTTING(砍树) / FARMING(农业)。
# required-level:
#   DIAMOND_ORE:
#     category: MINING
#     level: 10