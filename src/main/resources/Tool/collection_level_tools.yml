# ==========================================================================
#  采掘等级工具整合模板（Tool/collection_level_tools.yml）
# ==========================================================================
#  一个 yml 整合全部配套的采集工具，工具的采掘等级和资源点的 required-level 一一对应。
#  · attributes 里的 MiningLevel / ForestLevel / FarmingLevel 是【这把工具的采掘等级】：
#    资源点门槛直接拿它比较——工具采掘等级 ≥ 资源点 required-level 才能采集，
#    和其他插件的玩家等级无关。
#  · 等级链（照着资源点门槛配的，可直接用）：
#      挖矿  铜矿镐 3 → 铁矿镐 5 → 金矿镐 8 → 钻石镐 10 → 残骸镐 15
#      砍树  深色橡木斧 4 → 绯红菌柄斧 6
#      农业  西瓜锄 3 → 地狱疣锄 4
#  · MiningSpeed / ForestSpeed / FarmingSpeed 是采集速度的百分比加成（20 = +20%），
#    采集时间 = 资源点硬度 × 20 tick ÷ (1 + 速度/100)。
#  · 每个物品一个节点（items 下面），想加新工具复制一段改 id 和等级即可。
#  · 文件缺失时插件会自动写入一份（已存在不会覆盖）。
items:
  copper_mining_pickaxe:
    id: copper_mining_pickaxe
    material: IRON_PICKAXE
    display-name: "&6铜矿镐 &7(采掘等级 3)"
    attributes:
      MiningLevel: 3
      MiningSpeed: 10
      MiningFortune: 10
    custom-model-data: 0
    hide-enchantments: false
    Soulbound: false
    unbreakable: false
    description:
      - "&7采掘等级 3：可采铜矿资源点"

