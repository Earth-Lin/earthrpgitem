# ==========================================================================
#  技能强化系统（Skill Leveling）
# ==========================================================================
#  设计要点（改配置前请先读一遍）：
#
#  1. 等级只在数据文件里存【一个整数】（skill-levels.yml），技能的成长
#     规则写在【技能自己的 yml】里。所以改这里的数值后，全服已升级的技能
#     会【立刻】跟着变，不需要重刷技能、也不需要回收玩家数据。
#
#  2. 等级属于【玩家 + 技能 ID】，不属于物品。因为技能背包存的是技能 ID、
#     物品只是「取出/放回」的凭证，所以：
#       · 把技能从背包取出再放回去，等级不会丢；
#       · 复制/备份技能物品不会复制出等级；
#       · 把技能物品交易给别人，对方拿到的是 Lv.1（等级不跟着物品走）。
#
#  3. 成长规则支持【任意数值字段】，不是笼统的「伤害 +X%」。例如幻影剑舞
#     可以配置成「每级 +1 挥砍次数」。规则写在技能 yml 的 leveling 段：
#
#       leveling:
#         max-level: 10                 # 可选，覆盖这里的默认上限
#         per-level:                    # 每升一级叠加多少
#           phantom-blade.slash-count: 1        # 每级 +1 挥砍次数
#           phantom-blade.weapon-percent: 5     # 每级 +5%
#         levels:                       # 可选：某些等级的【绝对值】覆盖
#           10:
#             phantom-blade.slash-count: 15     # Lv.10 起挥砍次数直接为 15
#         cost:                         # 可选：覆盖这里的消耗
#           tiers:
#             - max-level: 20
#               gems:
#                 ruby: 2
#
#     规则：Lv.1 = 技能文件里原本写的值。之后每一级加上 per-level 的量；
#     如果某个 levels.<N> 定义了该字段，则从 Lv.N 起改用那个绝对值，并继续
#     按 per-level 往上加。字段路径就是 yml 里的路径，写错只会在控制台警告，
#     不会让技能失效。
#
#  4. 升级【必定成功】，只消耗材料、不会降级、不会失败。技能是长期养成的
#     确定投入，随机失败会让玩家已经投入的进度永久变弱。
#
# --------------------------------------------------------------------------

# 是否开启技能强化。关闭后：已经升过的等级仍然保留并生效（不会静默削弱
# 玩家已投入的成果），只是不能再升。
enabled: true

# 默认等级上限。单个技能可以在自己 yml 的 leveling.max-level 里覆盖。
# 上限之外不可升级；把技能上限调低不会让已超出的等级失效（超出的部分按新上限显示）。
max-level: 10

# 升级消耗。两种模式二选一，由 config.yml 的 earthexp 段决定：
#   · 已接入 EarthExp（earthexp.api-class / stat-class 已填）：消耗【战斗天赋点】，
#     升到第 N 级花 N 点（1→2 花 2 … 9→10 花 10，升到 10 级累计 54 点，Lv.1 免费）。
#     下面的 gems 段在技能点模式下不生效。
#   · 未接入 EarthExp：退回下面的宝石消耗。
#
# 宝石消耗（等级越高越贵）。
# tiers 从上往下匹配，取第一个 max-level >= 目标等级的段；都不匹配时用最后一段。
# gems 里的键是宝石 id（对应 gemstones.yml 里的 id）。
# 每升到 Lv.N 就按这一段扣一次。留空 gems 表示该段不消耗。
#
# 每段的宝石【总数量】刻意保持递增（1 → 3 → 4 → 9），
# 这样「越贵」在数量上就成立，不需要玩家去比较宝石的好坏。
cost:
  tiers:
    # Lv.2 ~ Lv.5：1 颗红宝石
    - max-level: 5
      gems:
        ruby: 1
    # Lv.6 ~ Lv.10：2 红 + 1 蓝
    - max-level: 10
      gems:
        ruby: 2
        sapphire: 1
    # Lv.11 ~ Lv.15：2 蓝 + 2 绿
    - max-level: 15
      gems:
        sapphire: 2
        emerald: 2
    # Lv.16 ~ Lv.20：4 红 + 3 蓝 + 2 绿
    - max-level: 20
      gems:
        emerald: 2
        sapphire: 3
        ruby: 4

# 界面与提示文案。{level} 等占位符会被替换。
messages:
  no-permission: "&c你没有使用技能强化台的权限。"
  not-enabled: "&c技能强化系统当前已关闭。"
  no-rules: "&c这个技能没有配置成长规则（leveling 段），无法强化。"
  max-level: "&e这个技能已经达到上限 Lv.{max}。"
  missing-points: "&c战斗天赋点不足，升级需要：&f{need}"
  missing-gems: "&c材料不足，升级需要：&f{need}"
  success: "&a技能强化成功：&f{skill} &aLv.{from} &7→ &aLv.{to}"
  save-failed: "&c保存失败，等级没有变化。请稍后再试。"
  not-owned: "&c你还没有这个技能，请先放入技能背包。"
