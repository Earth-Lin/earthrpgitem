config-version: 2

startup-message:
  enabled: true
  lines:
    - "&aEarthRPGItem &fVersion &e${version} &aenabled"
    - "&7RPG item framework, dummy and slash particles loaded"

features:
  rpgitems: true
  gui: true
  accessory: true
  fskill: true
  attack: true
  armor: true
  crit-chance: true
  crit-damage: true
  physical-crit: true
  magic-crit: true
  attack-speed: true
  health: true
  vitality: true
  lore-attributes: true
  recovery: true
  life-steal: true
  magic-damage: true
  magic-armor: true
  bow-damage: true
  exdraw: true
  fix: true
  ex-dur: true
  break-limit: true
  env-armor: true
  resistance: true
  bow-armor: true
  crit-armor: true
  evasion: true
  armor-pen: true
  true-damage: true
  backstrike-damage: true
  ass-damage: true
  pct-damage: true
  pst-damage: true
  attack-range: true
  parry: true
  counter-attack: true
  dodge: true
  block: true
  determination: true
  cad: true
  ice-damage: true
  fire-damage: true
  light-damage: true
  dark-damage: true
  ice-armor: true
  fire-armor: true
  light-armor: true
  dark-armor: true
  hit-buffs: true
  slash-particles: true
  projectile-trail-particles: true
  projectile-hit-particles: false
  projectile-sounds: false
  parry-particles: true
  # 等级要求：物品 yml 里的 level 字段。比对的是【EarthExp 的战斗等级】
  # （com.earthexp.api.Stat.COMBAT），不是原版等级；没装 EarthExp 时自动退回原版等级，
  # 避免所有带等级要求的物品突然全部失效。
  level: true
  soulbound: true
  particles: true
  sounds: true
  buffs: true
  collection: true
  # 宝石系统总开关。关闭后宝石台会说明原因，已镶嵌的宝石不再提供属性（但不会从装备里消失，
  # 重新打开就恢复）。
  gemstones: true
  farming-speed: true
  mining-speed: true
  forest-speed: true
  farming-fortune: true
  mining-fortune: true
  forest-fortune: true
  # 采集经验：资源点采集完成后按该资源点 yml 里的 experience 配置发经验事件给其他插件。
  # 本插件不处理经验等级，只负责发。（原版矿物的经验已禁用）
  gathering-xp: true
  # 采掘等级门槛：按资源点 yml 里的 required-level 判断能否采集该资源点。
  # 门槛只看【手持工具】attributes 里的 MiningLevel / ForestLevel / FarmingLevel
  # （采掘等级档位），和其他插件的玩家等级无关。
  gathering-levels: true
  # 手持工具提供的采掘等级（物品 attributes 里的 FarmingLevel / MiningLevel /
  # ForestLevel）。关闭后工具采掘等级视为 0，所有带门槛的资源点都采不动。
  farming-level: true
  mining-level: true
  forest-level: true
  # 采集点的破坏纹理（裂纹）动画：服务端按「硬度 × 20 ÷ 采集速度」推进的进度动画。
  # 关闭后挖采集点不再显示裂纹，同时会主动擦掉客户端本地预测画出来的原版裂纹。
  collection-break-animation: true
  # 客户端纠正：每 tick 把「玩家正在挖的采集点」按回真实方块状态，并擦掉客户端自己
  # 预测出来的裂纹。解决两个原版客户端本地预测造成的现象：
  #   1. 方块被挖掉——客户端按原版硬度算够了就在本地删掉方块，服务端取消破坏事件
  #      并不会告诉它「你猜错了」，于是方块在客户端一直是空气，直到我们重发一次；
  #   2. 裂纹速度跟原版硬度走而不是跟采集速度走——客户端把自己那份进度画在
  #      「玩家自己实体 id」的槽位里，和我们用的假 id 是两个条目，两个都会画。
  # 代价：正在挖采集点的玩家每 tick 多收 2 个包（只发给挖掘者本人，不影响其他人）。
  # 关闭后回到旧行为：方块可能被客户端本地删掉、裂纹按原版硬度显示。
  collection-client-guard: true
  # 挖掘疲劳：给「正在挖采集点」的玩家续一个短时挖掘疲劳（IV 级，速度 ×0.00081）。
  # 这是比上面的「事后纠正」更根本的一层——疲劳让【客户端自己】算不出「挖穿了」，
  # 于是它压根不会在本地删方块，也就不存在要按回去的问题。
  #   石头在疲劳 IV 下从 0.4 秒变成约 19 分钟，等于挖不掉。
  # 只作用于「正在挖采集点」的玩家：每 tick 续期 1 秒，停手后最多残留 1 秒自己消失。
  # 粒子与 HUD 图标已隐藏；不主动移除效果，避免误删别的插件给的同名效果。
  # 关闭后只剩 collection-client-guard 在事后纠正，方块可能仍会闪一下。
  collection-mining-fatigue: true

lore-templates:
  enabled: true
  hide-zero: true
  defaults:
    prefix: "  "
    icon: "&7◆"
    zh-color: "&6"
    en-color: "&7"
    value-color: "&f"
    name-separator: " "
    positive-prefix: "+"
  attribute-box:
    top: "&7┌──────────────────────────────────────┐"
    bottom: "&7└──────────────────────────────────────┘"
  separator:
    enabled: true
    lines:
      - "&8&m──────────────────────────────────────"
  # 宝石槽位那一行的显示。空槽位永远是白色 [   ]；已镶嵌的槽位把宝石自己的颜色和图标放进白色括号里，
  # 所以括号本身颜色不变，变化的是宝石——这是两颗不同宝石能被一眼区分的原因。
  socket-line:
    enabled: true
    label: "&7宝石槽: "
    bracket-color: "&f"
    gem-color: "&a"
  # 可按属性覆盖 zh、en、icon、zh-color、en-color、value-color
  attributes:
    exdraw:
      zh: "追加拉弓"
      en: "Extra Draw"
  # 原版属性修饰符（vanilla-attributes / minecraft-attributes）是否显示在属性框里
  show-vanilla-attributes: true
  # 药水 buff（buffs 配置）是否显示在属性框里
  show-buffs: true
  # 原版属性中文名（键名同 vanilla-attributes 键；未列出的键用英文原样显示）
  vanilla-attribute-names:
    max_health: "最大生命值"
    movement_speed: "移动速度"
    attack_damage: "攻击力"
    attack_speed: "攻击速度"
    armor: "护甲"
    armor_toughness: "护甲韧性"
    knockback_resistance: "击退抗性"
    luck: "幸运"
    attack_knockback: "攻击击退"
    jump_strength: "跳跃强度"

durability:
  warning-message: "&cItem is nearly broken, attributes are disabled"
  break-limit-message: "&cItem broke, BreakLimit protection triggered"
  fix-repairs-extra-durability: false

rpgitem:
  hide-enchantments-default: false
  prevent-hotkey-drop: true
  random-attributes:
    # true  = 每次属性结算（近战、弓箭、受到伤害、技能）都按范围重新随机
    # false = 只在物品生成时随机一次，之后永久固定
    # 被动刷新（每秒的血量同步）始终使用固定值，避免最大生命每秒抖动。
    reroll-on-use: true

defensive-actions:
  timing-window-seconds: 0.3
  invalid-window-seconds: 1.0
  repeat-guard-seconds: 1.0
  resistance-duration-seconds: 1.0
  dodge:
    cooldown-seconds: 1.0
    particles-enabled: true
    particle-count: 48
    particle-radius: 1.0
    sound-enabled: true
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.2
  block:
    cooldown-seconds: 1.0
    particles-enabled: true
    particle-count: 48
    particle-radius: 0.8
    sound-enabled: true
    sound: BLOCK_ANVIL_LAND
    volume: 1.0
    pitch: 0.4

accessory:
  types:
    ring: "戒指 Ring"
    earring: "耳饰 Earring"
    chest: "胸饰 Chest Ornament"
    hand: "手饰 Hand Ornament"
    necklace: "项链 Necklace"
    belt: "腰饰 Belt"
    cloak: "披风 Cloak"

