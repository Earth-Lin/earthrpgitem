  duration-seconds: 3
  slash-diameter: 2.0
  slash-radius: 0.08
  length: 1.2
  thrust-diameter: 1.5
  thrust-radius: 0.18
  start-random-radius: 0.5
  start-forward-distance: 1.0

projectile-draw-sound:
  enabled: true
  sound: BLOCK_NOTE_BLOCK_PLING
  volume: 0.35
  low-pitch: 0.6
  high-pitch: 1.4
  stage-pitch-step: 0.08

projectile-launch-sound:
