counter-attack-sound:
  enabled: true
  sound: ENTITY_WITHER_HURT
  volume: 1.0
  pitch: 0.8

sounds:
  enabled: true
  sound: ENTITY_PLAYER_ATTACK_STRONG
  volume: 1.0
  pitch: 1.0

buffs:
  enabled: true
  refresh-interval-seconds: 10
  duration-seconds: 13

hit-buffs:
  enabled: true

dummy:
  default-type: ZOMBIE
  clear-radius: 32
  max-health: 1000000

join-broadcast:
  enabled: true
  message: "&aWelcome &e{player} &ato the game"
fskill:
  default-cooldown-seconds: 5
  chant-interrupted-message: "&c切换物品，吟唱已中断，技能冷却已重置。"
  max-ray-length: 512
  ray-step: 0.4
  # 「王之宝库」全服同时存在的武器实体上限（每个武器 = 一个 ItemDisplay 实体）。
  # 单次施放的上限固定为 32；这里是所有施放加起来的残留上限，用于防止刷技能把实体数堆爆。
  # 满攻速连续施放做压力测试时会被这个值挡住，需要更高就调大（调大 = 实体更多 = 服务端压力更大）。
  gate-max-live-displays: 512
  activation-message-enabled: true
  fskill-messages-enabled: true
  rskill-messages-enabled: true
  srskill-messages-enabled: true
  qskill-messages-enabled: true
  sqskill-messages-enabled: true
  lskill-messages-enabled: true
  sfskill-messages-enabled: true
  slskill-messages-enabled: true
  # 冷却提示开关：控制“冷却中 / 全局冷却 / 技能释放中”这类暂时无法释放的提示
  cooldown-message-enabled: true
  # 技能就绪提示开关：控制“技能已就绪”提示
  ready-message-enabled: true
  activation-message: "&b{item}&f释放了F技能"
  ready-message: "&a{item}&fF技能已就绪"
  cooldown-message: "&e{item}&cF技能冷却: &f{seconds}秒"
  fskill-activation-message: "&b{item}&f释放了F技能"
  fskill-ready-message: "&a{item}&fF技能已就绪"
  fskill-cooldown-message: "&e{item}&cF技能冷却: &f{seconds}秒"
  rskill-activation-message: "&b{item}&f释放了R技能"
  rskill-ready-message: "&a{item}&fR技能已就绪"
  rskill-cooldown-message: "&e{item}&cR技能冷却: &f{seconds}秒"
  srskill-activation-message: "&b{item}&f释放了SR技能"
  srskill-ready-message: "&a{item}&fSR技能已就绪"
  srskill-cooldown-message: "&e{item}&cSR技能冷却: &f{seconds}秒"
  qskill-activation-message: "&b{item}&f释放了Q技能"
  qskill-ready-message: "&a{item}&fQ技能已就绪"
  qskill-cooldown-message: "&e{item}&cQ技能冷却: &f{seconds}秒"
  sqskill-activation-message: "&b{item}&f释放了SQ技能"
  sqskill-ready-message: "&a{item}&fSQ技能已就绪"
  sqskill-cooldown-message: "&e{item}&cSQ技能冷却: &f{seconds}秒"
  lskill-activation-message: "&b{item}&f释放了L技能"
  lskill-ready-message: "&a{item}&fL技能已就绪"
  lskill-cooldown-message: "&e{item}&cL技能冷却: &f{seconds}秒"
  sfskill-activation-message: "&b{item}&f释放了SF技能"
  sfskill-ready-message: "&a{item}&fSF技能已就绪"
  sfskill-cooldown-message: "&e{item}&cSF技能冷却: &f{seconds}秒"
  slskill-activation-message: "&b{item}&f释放了SL技能"
  slskill-ready-message: "&a{item}&fSL技能已就绪"
  slskill-cooldown-message: "&e{item}&cSL技能冷却: &f{seconds}秒"
  global-cooldown-message: "&e{skill}同类型全局冷却: &f{seconds}秒"
  cooldown-name-placeholder: "{skill}"
  particle-default-duration-seconds: 3
  # 技能暴击的族排除表。留空（默认）＝物理族与魔法族都可暴击。
  # 暴击按族结算，与普通攻击一致：物理族（物理/弓）一次判定，魔法族（魔法/药水）一次判定；
  # 元素（冰/火/光/暗）与真实伤害不单独暴击，只会从翻倍后的基数按百分比放大。
  # 写 PHYSICAL 取消物理族暴击，写 MAGIC 取消魔法族暴击。
  crit-excluded-damage-types: []

skill-panel:
  default-enabled: false
  default-trigger-enabled: true
  # ------------------------------------------------------------------------
  #  仅手持 RPG 物品才能放技能（require-held-rpgitem）
  # ------------------------------------------------------------------------
  #  true（默认）= 主手必须拿着本插件的 RPG 物品（含技能书等独立技能物品），
  #                面板键位技能与物品自带技能才会触发。
  #  false        = 旧行为：不看手里拿什么，随时可放。
  #
  #  为什么默认开：不限制的话，绑了右键技能的玩家一「右键吃食物」就会放技能，
  #  而且事件被取消、食物还吃不到——严重破坏游戏体验。
  #
  #  判定只看【主手】：饰品（ACCESSORY）不算；副手拿着 RPG 物品也不算，
  #  所以主手拿食物右键吃饭不会触发副手的技能。
  #  丢弃键（Q/SQ）特殊处理：判定用的是「被丢掉的那件」，所以丢弃 RPG 物品照常放技能。
  #
  #  被这道限制拦下时【不会】给玩家发提示（他可能只是想吃个饭），
  #  要查为什么放不出技能请用 /rpgitem skillcheck。
  require-held-rpgitem: true
  # ------------------------------------------------------------------------
  #  对着方块左键时不触发 L/SL 技能（suppress-left-click-on-block）
  # ------------------------------------------------------------------------
  #  true（默认）= 对着【方块】左键时不放 L/SL 技能（视为在挖矿），
  #                对着【空气】左键、或左键【实体】照常放技能。
  #  false        = 旧行为：对着方块左键也会放技能。
  #
  #  为什么默认开：原版「左键方块」就是开始挖掘，而技能触发会把
  #  PlayerInteractEvent 取消掉——方块于是完全挖不动（连挖掘进度都不开始）。
  #  玩家拿着带 L/SL 技能的 RPG 工具挖矿时技能不断触发、挖掘被打断，根因就在这里。
  #  战斗场景用的是「左键空气 / 左键怪物」，两者都不受影响。
  suppress-left-click-on-block: true
  # 新玩家的技能面板提示开关默认值（可在技能面板里逐个切换）
  default-cooldown-message-enabled: true
  default-ready-message-enabled: true
  # 每个键位独立的「释放提示」默认值；玩家可在技能面板按 Q/SQ/F/SF/R/SR/L/SL 逐键关闭
  default-activation-message-enabled: true
  # 技能注册默认不需要在这里配置。
  # 插件会自动扫描 plugins/EarthRPGItem/skills 下的所有 .yml 文件，
  # 每个文件自动注册为一个技能，技能 ID 就是文件名（不含 .yml）。
  # 技能名称、材质、技能组、武器限制都可以直接写在技能文件里：
  #   display-name: "&b横扫"
  #   material: ENCHANTED_BOOK
  #   skill-group: "技能组1"
  #   supported-weapons: [SWORD, AXE]
  #   description:
  #     - "&7向前横扫，对前方扇形范围内的敌人造成伤害。"
  #     - "&7冷却随攻速变化。"
  #
  # description 会显示在技能物品的 lore 最上方（技能面板 / 技能库 / 技能背包 / 发给玩家的
  # 技能物品都是同一份 lore）。也可以写在下面 skills.<id>.description 里覆盖技能文件的写法。
  #
  # 只有在需要覆盖技能文件设置，或把技能绑定到已有 RPGItem 时，才需要下面的写法：
  # skills:
  #   sweep:
  #     skill-file: "横扫.yml"
  #     display-name: "&b横扫"
  #     material: ENCHANTED_BOOK
  #     skill-group: "技能组1"
  #     description: ["&7向前横扫，对前方扇形范围内的敌人造成伤害。"]
  #   cross-slash:
  #     skill-file: "十字斩.yml"
  #     display-name: "&d十字斩"
  #     material: ENCHANTED_BOOK
  #     skill-group: "技能组2"

# ==========================================================================
#  EarthExp 附属（天赋点 = 技能点）
# ==========================================================================
#  装了这个附属插件后，技能升级改用「天赋点」扣费，不再消耗宝石；
#  技能等级上限默认 Lv.10（skill-leveling.yml 的 max-level）。
#
#  装了 EarthExp 就【自动接入】，不需要你填类名：下面两个类名留空时，插件会按
#  EarthExp 的标准类名（com.earthexp.api.EarthExpAPI / com.earthexp.api.Stat）自动探测。
#
#  启动日志会明确告诉你接没接上：
#    · 「EarthExp 已接入：技能升级消耗【战斗】天赋点（轨道 COMBAT）」 = 成功；
#    · 「未检测到 EarthExp（可选附属）：技能升级使用宝石消耗」 = 没装上（不装也能正常玩）；
#    · 「找到了 ... 但它没有把 EarthExpAPI 注册到服务管理器」 = 装上了但没启用成功，
#      去看 EarthExp 自己的启动日志有没有报错。
#
#  一般不需要动下面两个类名。只有 EarthExp 换了包名时才需要手填。
#
#  想【强制】用宝石消耗（即使装了 EarthExp）：把 earthexp.enabled 改成 false。
#
# --------------------------------------------------------------------------
#  技能点用哪条天赋池（skill-point-stat）
# --------------------------------------------------------------------------
#  ⚠️ 先确认你的 EarthExp 版本支持哪条轨道（见下）。
#
#  EarthExp 0.5.1 起，外部扣点【按轨道分开记账】，两条轨道互不干扰：
#    · skill-point-stat: COMBAT     → 扣战斗池（eexp_combat_tp），不碰冒险池；
#    · skill-point-stat: ADVENTURE  → 扣冒险池（eexp_adv_tp），不碰战斗池。
#  每条轨道的可用点数 = 该轨道等级 − 该轨道外部扣点；退款也不能跨轨道。
#
#  ⚠️ 如果你的 EarthExp 是 0.5.0 或更早：那时外部扣点【只允许 ADVENTURE】，
#     配成 COMBAT 会在升级时被 EarthExp 拒绝（提示「EarthExp 拒绝了这次扣点」）。
#     解决办法：把 EarthExp 升级到 0.5.1+（推荐，之后 COMBAT 可用），
#     或把这里改成 ADVENTURE。
#
#  本插件扣点时用的来源名是 earthrpgitem_skills（写死在代码里，跨重启必须稳定）。
#  EarthExp 按来源分账，退款上限就是该来源【在该轨道上】实际扣过的量——所以
#  「重置技能等级能退多少点」取决于账本，而不是 skill-levels.yml 里的等级。
#  升级发生在扣点接口出现之前的技能，账上没有记录，重置时退不出点数。
#
#  旧键名 combat-stat 仍然兼容（skill-point-stat 没写时读它），但新配置请用 skill-point-stat。
earthexp:
  # 总开关：true（默认）= 装了 EarthExp 就自动接入；false = 强制用宝石消耗。
  enabled: true
  # 留空 = 自动探测 EarthExp 的标准类名（推荐）。EarthExp 换包名时才手填。
  api-class: ""
  stat-class: ""
  # 技能点走哪条天赋轨道：COMBAT（战斗天赋点，默认）或 ADVENTURE（冒险天赋点）。
  skill-point-stat: COMBAT
  # 旧键名，保留兼容；skill-point-stat 有值时忽略这里。
  combat-stat: COMBAT

