  prefix-enabled: false
  duration-seconds: 3
  random-range: 1.0
  physical-color: "&c"
  physical-crit-color: "&6"
  magic-color: "&d"
  magic-crit-color: "&5"
  bow-color: "&a"
  bow-crit-color: "&2"
  assassin-color: "&c"
  assassin-format: "☠刺客-{damage}"
  backstrike-color: "&e"
  backstrike-format: "🗡背击-{damage}"
  true-color: "&c"
  ice-color: "&9"
  fire-color: "&c"
  dark-color: "&0"
  light-color: "&e"
  physical-prefix: "\uD83D\uDDE1\u2764-"
  physical-crit-prefix: "\u2694\u2764-"
  magic-prefix: "\u2721\u2764-"
  magic-crit-prefix: "\uD83D\uDD2F\u2764-"
  bow-prefix: "\uD83C\uDFF9\u2764-"
  bow-crit-prefix: "\uD83C\uDFF9\u2B50\u2764-"
  true-prefix: "\u2620\u2764-"
  ice-prefix: "\uD83E\uDDCA\u2764-"
  fire-prefix: "\uD83D\uDD25\u2764-"
  dark-prefix: "\uD83C\uDF18\u2764-"
  light-prefix: "\u2600\u2764-"
  physical-format: "\uD83D\uDDE1\u2764-{damage}"
  physical-crit-format: "\u2694\u2764-{damage}"
  magic-format: "\u2721\u2764-{damage}"
  magic-crit-format: "\uD83D\uDD2F\u2764-{damage}"
  bow-format: "\uD83C\uDFF9\u2764-{damage}"
  bow-crit-format: "\uD83C\uDFF9\u2B50\u2764-{damage}"
  true-format: "\u2620\u2764-{damage}"
  ice-format: "\uD83E\uDDCA\u2764-{damage}"
  fire-format: "\uD83D\uDD25\u2764-{damage}"
  dark-format: "\uD83C\uDF18\u2764-{damage}"
  light-format: "\u2600\u2764-{damage}"

particles:
