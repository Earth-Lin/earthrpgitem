  sound: ENTITY_WITHER_SHOOT
  volume: 0.7
  pitch: 1.0

projectile-trail-particles:
  enabled: true
  particle: DUST
  color: "128,128,128"
  count: 2
  radius: 0.05

projectile-trail-sound:
  enabled: false
  sound: ENTITY_WITHER_SHOOT
  volume: 0.18
  pitch: 1.2
  interval-ticks: 4

projectile-hit-feedback:
  allow: false

projectile-hit-particles:
  enabled: false
  particle: FIREWORK
  color: "128,128,128"
  effect: current
  count: 80
  radius: 1.2

projectile-hit-sound:
  enabled: false
  sound: ENTITY_FIREWORK_ROCKET_BLAST
  volume: 1.0
  pitch: 1.0

parry-particles:
  enabled: true
  count: 48
  radius: 0.8
