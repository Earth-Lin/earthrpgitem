# ==========================================================================
#  等级资源点整合模板（Collection/collection_level_points.yml）
# ==========================================================================
#  一个 yml 整合全部带【经验】和【采掘等级门槛】的资源点模板。
#  · experience：采集成功一次发给外部插件多少经验（抛 GatheringExperienceEvent）。
#  · required-level：采集这个资源点需要的【工具采掘等级】（按 type 分类判定；
#    门槛只看手持工具 attributes 里的 MiningLevel / ForestLevel / FarmingLevel，
#    和其他插件的玩家等级无关）。
#  · 原版矿物不给经验、不设门槛；经验与门槛都只在这里（资源点）编辑。
#  · 想加新资源点：复制下面任意一段，改 id / materials / experience / required-level。
#  · 文件缺失时插件会自动写入一份（已存在不会覆盖）。
collections:
  copper_collection:
    id: copper_collection
    display-name: "&6铜矿资源点"
    type: MINING
    materials: [COPPER_ORE]
    item-material: COPPER_ORE
    support-materials: [STONE, DEEPSLATE]
    hardness: 1.8
    refresh-seconds: 60
    depleted-material: AIR
    experience: 8
    required-level: 3
    drops:
      copper:
        item: COPPER_INGOT
        amount: 2.0
        chance: 100
      stone:
        item: COBBLESTONE
        amount: 1.0
        chance: 40

  iron_collection:
