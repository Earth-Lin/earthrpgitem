# Gradle / JVM settings for EarthRPGItem (Minecraft 1.21.1 / Paper API)
# Toolchain: JDK 21 is required by paper-api 1.21.1
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8

# 自动发现本机 JDK 21。
# 如需指定绝对路径，请写在【不提交】的 ~/.gradle/gradle.properties 里，例如：
#   org.gradle.java.installations.paths=C:/path/to/jdk-21
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
