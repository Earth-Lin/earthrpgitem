# ==========================================================================
#  带宝石槽位的武器 —— 直接放进 plugins/EarthRPGItem/Weapon/
# ==========================================================================
#  用法：
#    1. 把这个文件放进 plugins/EarthRPGItem/Weapon/
#    2. /rpgitem reload
#    3. /rpgitem give gem_sword
#    4. 手持它执行 /rpgitem gems 打开宝石台镶嵌宝石
#
#  说明：这是 .yml 物品配置，所以它会成为武器 GUI 里的一个独立分组，
#        分组名就是文件名（宝石长剑）。
# ==========================================================================

id: gem_sword
material: NETHERITE_SWORD
display-name: "&6&l宝石长剑"

# ★ 关键的一行：宝石槽位数量。
#
#   · 不写这一行 = 0 个槽位，宝石插不上去。
#     这就是「武器需要注册才能有宝石槽位」的实现方式：槽位数由物品文件决定，
#     不是按武器类型统一给的，所以你可以逐件控制哪把武器能镶宝石。
#   · 槽位在物品描述里显示为白色 [   ]；插上宝石后，方括号里会变成
#     那颗宝石自己的颜色和图标（例如红宝石 [♥]、蓝宝石 [✦]）。
#     括号本身永远是白色，变的是里面的图标——这样两颗宝石才能一眼区分开。
#   · 想加槽位就改这个数字（宝石台一屏最多显示 9 个）。
sockets: 3

# 属性。
#
# 强化只放大【伤害类】属性（enhancement.yml 的 included-stats 白名单），所以：
#   · Attack / CritDamage / CritDamagePercent → 会有蓝色 [+N]
#   · CritChance / Health → 不会有蓝色 [+N]（不在白名单里，强化不动它们）
# 这不影响它们本身的数值，只是不吃强化加成。
#
# 宝石给的属性是【固定值】，但会【参与强化】：
# 宝石的值先并进这件武器的基础属性，再被强化百分比一起放大。
attributes:
  Attack: 18
  CritDamage: 25
  CritDamagePercent: 12
  CritChance: 12
  Health: 10

# 等级要求。0 = 不需要等级（写 >0 时玩家等级不够就用不了）。
requirements:
  Level: 0

custom-model-data: 0
hide-enchantments: false
Soulbound: false
unbreakable: false

# 改完这个文件后把 item-version 加 1，全服这件武器会重建一次并刷新描述。
item-version: 1

# 写在属性框下方的说明文字。宝石槽位那一行是插件自动生成的，
# 不需要（也不应该）在这里手写，否则会重复两行。
description:
  - "&7一把预留了三个宝石槽位的长剑。"
  - "&7手持它执行 &f/rpgitem gems &7即可镶嵌宝石。"
