# 分发文件放在用户目录（GRADLE_USER_HOME）而不是项目根。
# 原因：distributionBase=PROJECT 会把整个 Gradle 8.8（~145MB）解压到项目根的 wrapper/ 目录，
# 而 Gradle 的 clean 任务会删除项目根下所有非源码目录 —— 一执行 clean 分发包就废掉，
# 后续构建报 "Cannot locate JAR for module 'ant'"。
# 改用 GRADLE_USER_HOME 后，分发包在 ~/.gradle/wrapper/dists，clean 不会碰到。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.8-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
